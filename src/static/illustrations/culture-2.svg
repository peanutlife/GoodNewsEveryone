<path d="M276 226 L296 96"/><path d="M314 226 L324 96"/>
<path d="M282 190 h30 M288 156 h28 M293 122 h26"/>
</g>
<!-- whoever is up it, with a roller -->
<path d="M268 160 l-18 -22" stroke="#C98C5A" stroke-width="7" stroke-linecap="round"/>
<path d="M258 196 V154 a17 17 0 0 1 34 0 v42 z" fill="#E8718A"/>
