<path d="M164 224 C 176 196 206 184 236 188 C 230 212 202 226 164 224 Z" fill="#4FAFA8"/>
<path d="M186 224 C 190 206 206 196 222 194" stroke="#2F8F88" stroke-width="3" fill="none"/>
