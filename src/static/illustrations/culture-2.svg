<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
<!-- Peanutlife section art, "Culture & ideas" variant 2: a wall getting a mural,
     half of it still bare plaster with the outline pencilled in. Flat on to the
     wall, daylight, no sky. Original flat drawing; figures are simple shapes with
     no facial features. Subject sits inside x 63-417, y 81-216, the 32/9 band. -->
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0E9F8"/><stop offset="1" stop-color="#E6D9F5"/></linearGradient>
</defs>
<rect width="480" height="270" fill="url(#g)"/>
<!-- the wall -->
<rect x="0" y="22" width="480" height="202" fill="#EFE7DC"/>
<g fill="#E5DACB" opacity=".8"><rect x="0" y="62" width="480" height="3"/><rect x="0" y="118" width="480" height="3"/><rect x="0" y="174" width="480" height="3"/></g>
<rect x="0" y="22" width="480" height="7" fill="#D6C9B6"/>
<!-- the painted half -->
<circle cx="132" cy="110" r="40" fill="#F2B33D"/>
<g stroke="#F2B33D" stroke-width="6" stroke-linecap="round"><path d="M132 52 v-14 M132 182 v-14 M74 110 h-14 M190 110 h14 M92 70 l-10 -10 M172 150 l10 10 M172 70 l10 -10 M92 150 l-10 10"/></g>
