<path d="M268 216 h34 v-26 a6 6 0 0 0 -6 -6 h-22 a6 6 0 0 0 -6 6 z" fill="#F2C14E"/>
<rect x="278" y="180" width="14" height="7" rx="3" fill="#DCA92F"/>
<path d="M306 212 h30 v-24 a5 5 0 0 0 -5 -5 h-20 a5 5 0 0 0 -5 5 z" fill="#4FAFA8"/>
