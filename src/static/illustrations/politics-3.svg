<circle cx="201" cy="149" r="12" fill="#8C5A3C"/><path d="M189 149 a12 12 0 0 1 24 0 z" fill="#2F2A26"/>
<path d="M217 176 l22 10" stroke="#8C5A3C" stroke-width="7" stroke-linecap="round"/>
<path d="M352 214 V172 a15 15 0 0 1 30 0 v42 z" fill="#7FB7C8"/>
<circle cx="367" cy="157" r="11" fill="#E8B98A"/><path d="M356 157 a11 11 0 0 1 22 0 z" fill="#A3471A"/>
<path d="M352 182 l-14 8" stroke="#E8B98A" stroke-width="7" stroke-linecap="round"/>
</svg>
