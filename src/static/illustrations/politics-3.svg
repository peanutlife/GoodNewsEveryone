<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
<!-- Peanutlife section art, "Politics" variant 3: a service actually delivered -
     the mains reach a village and the standpipe runs. Early morning, warm light
     from the left, close low viewpoint. Original flat drawing; figures are simple
     shapes with no facial features. Subject sits inside x 63-417, y 81-216. -->
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDF0E2"/><stop offset=".55" stop-color="#EAEBF3"/><stop offset="1" stop-color="#D9E3F5"/></linearGradient>
<radialGradient id="dawn" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE3B8" stop-opacity=".85"/><stop offset="1" stop-color="#FFE3B8" stop-opacity="0"/></radialGradient>
</defs>
<rect width="480" height="270" fill="url(#g)"/>
<ellipse cx="40" cy="150" rx="130" ry="72" fill="url(#dawn)"/>
<g stroke="#2F4A7A" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".5">
<path d="M300 98 c 6 -6 11 -6 17 0"/><path d="M317 98 c 6 -6 11 -6 17 0"/><path d="M356 112 c 5 -5 9 -5 14 0"/>
</g>
<!-- the ridge behind the village -->
<path d="M0 158 C 80 136 170 150 262 142 C 350 134 420 150 480 142 V190 H0 Z" fill="#C4CEE4"/>
<!-- the village -->
<g>
<path d="M66 186 h58 v-34 h-58 z" fill="#E7EAF4"/><path d="M60 152 l35 -22 35 22 z" fill="#D9A36B"/>
<rect x="84" y="162" width="18" height="24" rx="3" fill="#A9BBDC"/>
<path d="M142 186 h50 v-28 h-50 z" fill="#EFEADF"/><path d="M137 158 l30 -19 30 19 z" fill="#C98C5A"/>
<rect x="158" y="166" width="16" height="20" rx="3" fill="#A9BBDC"/>
<path d="M330 186 h54 v-30 h-54 z" fill="#E7EAF4"/><path d="M325 156 l32 -20 32 20 z" fill="#D9A36B"/>
<rect x="348" y="164" width="16" height="22" rx="3" fill="#A9BBDC"/>
<path d="M398 186 h44 v-24 h-44 z" fill="#EFEADF"/><path d="M394 162 l26 -17 26 17 z" fill="#C98C5A"/>
</g>
<g fill="#8FBB94"><circle cx="212" cy="168" r="14"/><path d="M212 186 V168" stroke="#9A6F45" stroke-width="5"/><circle cx="302" cy="172" r="11"/><path d="M302 186 V172" stroke="#9A6F45" stroke-width="4"/></g>
<!-- the ground, then the backfilled trench the pipe came in along -->
<path d="M0 186 H480 V270 H0 Z" fill="#DCC9A8"/>
<path d="M0 198 C 90 192 150 206 240 204 C 330 202 400 212 480 206 V222 C 400 228 330 218 240 220 C 150 222 90 208 0 214 Z" fill="#C8AE86"/>
<g stroke="#B49668" stroke-width="2.5" stroke-linecap="round" opacity=".8"><path d="M26 206 l10 6"/><path d="M96 202 l10 6"/><path d="M166 210 l10 6"/></g>
<!-- the pipe, a length still lying out -->
<rect x="24" y="198" width="104" height="16" rx="8" fill="#4C6AA0"/>
<rect x="118" y="194" width="14" height="24" rx="4" fill="#2F4A7A"/>
<rect x="24" y="201" width="104" height="4" rx="2" fill="#7F96C4" opacity=".8"/>
<!-- the standpipe -->
<rect x="216" y="168" width="44" height="48" rx="6" fill="#E3E8F1"/>
<rect x="212" y="162" width="52" height="10" rx="5" fill="#CBD4E5"/>
<rect x="232" y="128" width="12" height="36" rx="5" fill="#2F4A7A"/>
<path d="M244 140 h22 v9 h-22 z" fill="#2F4A7A"/>
<circle cx="238" cy="126" r="9" fill="#4C6AA0"/><path d="M229 126 h18" stroke="#1F3560" stroke-width="4" stroke-linecap="round"/>
<!-- the water -->
<path d="M262 150 C 274 164 280 176 282 190" stroke="#7FC8DC" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M264 152 C 274 164 279 174 281 186" stroke="#BCE2E8" stroke-width="3" fill="none" stroke-linecap="round"/>
