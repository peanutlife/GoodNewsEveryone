<path d="M172 148 l-8 13 12 8 -8 13" stroke="#4FAFA8" stroke-width="3" fill="none" stroke-linecap="round"/>
<!-- balloons -->
<path d="M346 152 C 340 168 352 170 348 186" stroke="#AC8341" stroke-width="2" fill="none"/>
<path d="M376 160 C 370 174 380 178 376 190" stroke="#AC8341" stroke-width="2" fill="none"/>
<ellipse cx="346" cy="138" rx="17" ry="20" fill="#E8718A"/>
<ellipse cx="376" cy="146" rx="14" ry="17" fill="#4FAFA8"/>
<ellipse cx="340" cy="131" rx="5" ry="7" fill="#FFF4E6" opacity=".55"/>
