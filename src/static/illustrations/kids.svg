<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
<!-- Peanutlife section art, "For kids": a kite afternoon on a hill.
     Original flat drawing. Figures are simple shapes with no facial features. -->
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFBF2"/><stop offset="1" stop-color="#FFE9A8"/></linearGradient></defs>
<rect width="480" height="270" fill="url(#g)"/>
<circle cx="406" cy="84" r="46" fill="#FFF3CC"/><circle cx="406" cy="84" r="29" fill="#F7C756"/>
<g fill="#FFFDF7"><rect x="40" y="78" width="104" height="26" rx="13"/><circle cx="74" cy="78" r="19"/><circle cx="112" cy="82" r="14"/><rect x="250" y="54" width="72" height="20" rx="10"/><circle cx="276" cy="54" r="15"/></g>
<g fill="#FFFDF7" opacity=".8"><circle cx="92" cy="152" r="4"/><circle cx="124" cy="178" r="3"/><circle cx="440" cy="150" r="4"/><circle cx="58" cy="124" r="3"/><circle cx="330" cy="98" r="3"/></g>
<!-- kite and its string -->
<path d="M172 148 C 188 166 198 158 214 168" stroke="#AC8341" stroke-width="2.5" fill="none" stroke-linecap="round"/>
