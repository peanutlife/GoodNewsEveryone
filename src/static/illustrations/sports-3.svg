<g fill="#F2C14E"><circle cx="20" cy="190" r="6"/><circle cx="52" cy="190" r="6"/><circle cx="84" cy="190" r="6"/><circle cx="116" cy="190" r="6"/><circle cx="148" cy="190" r="6"/><circle cx="180" cy="190" r="6"/><circle cx="212" cy="190" r="6"/><circle cx="244" cy="190" r="6"/><circle cx="276" cy="190" r="6"/><circle cx="308" cy="190" r="6"/><circle cx="340" cy="190" r="6"/><circle cx="372" cy="190" r="6"/><circle cx="404" cy="190" r="6"/><circle cx="436" cy="190" r="6"/><circle cx="468" cy="190" r="6"/></g>
