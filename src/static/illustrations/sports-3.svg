<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
<!-- Peanutlife section art, "Sports" variant 3: a pool at training time, seen from
     straight above - two lane ropes, two swimmers mid-stroke, the deck at top and
     bottom. No sky, no horizon. Original flat drawing; figures are simple shapes
     with no facial features. Subject sits inside x 63-417, y 81-216, the 32/9 band. -->
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FC6D4"/><stop offset=".5" stop-color="#4FAFC2"/><stop offset="1" stop-color="#3C96AC"/></linearGradient>
</defs>
<rect width="480" height="270" fill="url(#g)"/>
<!-- the deck, top and bottom -->
<rect x="0" y="0" width="480" height="56" fill="#F7C3A1"/>
<rect x="0" y="56" width="480" height="6" fill="#FFFDF7"/>
<rect x="0" y="238" width="480" height="32" fill="#F7C3A1"/>
<rect x="0" y="232" width="480" height="6" fill="#FFFDF7"/>
<g fill="#EFAE84"><rect x="0" y="16" width="480" height="4"/><rect x="0" y="256" width="480" height="4"/></g>
<!-- starting blocks -->
<g fill="#EFAE84"><rect x="96" y="24" width="48" height="32" rx="5"/><rect x="232" y="24" width="48" height="32" rx="5"/><rect x="368" y="24" width="48" height="32" rx="5"/></g>
<g fill="#A3471A"><rect x="112" y="16" width="16" height="10" rx="3"/><rect x="248" y="16" width="16" height="10" rx="3"/><rect x="384" y="16" width="16" height="10" rx="3"/></g>
<!-- light caustics -->
<g stroke="#A8E4EC" stroke-width="4" fill="none" stroke-linecap="round" opacity=".35">
<path d="M28 86 C 52 76 70 94 96 84"/><path d="M348 88 C 372 78 390 96 416 86"/><path d="M48 220 C 72 210 90 228 116 218"/><path d="M382 162 C 404 152 422 170 448 160"/>
