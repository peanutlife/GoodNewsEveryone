<!-- two lane ropes, kept small so the swimmers carry the picture -->
<g fill="#F2785C"><circle cx="20" cy="118" r="6"/><circle cx="52" cy="118" r="6"/><circle cx="84" cy="118" r="6"/><circle cx="116" cy="118" r="6"/><circle cx="148" cy="118" r="6"/><circle cx="180" cy="118" r="6"/><circle cx="212" cy="118" r="6"/><circle cx="244" cy="118" r="6"/><circle cx="276" cy="118" r="6"/><circle cx="308" cy="118" r="6"/><circle cx="340" cy="118" r="6"/><circle cx="372" cy="118" r="6"/><circle cx="404" cy="118" r="6"/><circle cx="436" cy="118" r="6"/><circle cx="468" cy="118" r="6"/></g>
