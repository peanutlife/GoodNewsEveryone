<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
<!-- Peanutlife section art, "Culture & ideas" variant 3: the reading room still open
     late - tall shelves, one lamp, one reader. Interior, night. Original flat
     drawing; figures are simple shapes with no facial features. Subject sits inside
     x 63-417, y 81-216, which is what the 32/9 band shows. -->
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A2F58"/><stop offset="1" stop-color="#5B4A7A"/></linearGradient>
<radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".8"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
</defs>
<rect width="480" height="270" fill="url(#g)"/>
