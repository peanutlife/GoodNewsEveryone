<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
<!-- Peanutlife section art, "Kindness" variant 2: one long table in the street,
     everybody's food in the middle, lights strung over it. Dusk. Original flat
     drawing; figures are simple shapes with no facial features. Subject sits inside
     x 63-417, y 81-216, which is what the 32/9 band shows. -->
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9B4CE"/><stop offset=".45" stop-color="#F3CBC4"/><stop offset="1" stop-color="#FFD6DF"/></linearGradient>
</defs>
<rect width="480" height="270" fill="url(#g)"/>
<g fill="#FFFDF7" opacity=".7"><circle cx="78" cy="40" r="2.5"/><circle cx="196" cy="28" r="2"/><circle cx="338" cy="44" r="2.5"/><circle cx="430" cy="26" r="2"/></g>
<!-- houses down the street -->
<g fill="#C9A8B6">
<path d="M12 170 h74 v-38 h-74 z"/><path d="M6 132 l43 -24 43 24 z"/>
<path d="M104 170 h62 v-30 h-62 z"/><path d="M98 140 l37 -20 37 20 z"/>
<path d="M318 170 h66 v-34 h-66 z"/><path d="M312 136 l39 -22 39 22 z"/>
<path d="M398 170 h74 v-28 h-74 z"/><path d="M392 142 l43 -22 43 22 z"/>
</g>
<g fill="#F7D98C"><rect x="34" y="140" width="16" height="18" rx="3"/><rect x="124" y="146" width="14" height="16" rx="3"/><rect x="340" y="144" width="15" height="18" rx="3"/><rect x="424" y="150" width="14" height="14" rx="3"/></g>
<g fill="#B898A8"><circle cx="222" cy="152" r="22"/><circle cx="252" cy="160" r="16"/><circle cx="196" cy="160" r="15"/><path d="M186 160 h80 v16 h-80 z"/></g>
