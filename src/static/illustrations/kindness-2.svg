<path d="M46 110 C 120 140 180 92 240 100 C 306 108 368 142 434 110" stroke="#A9798C" stroke-width="2.5" fill="none"/>
<g fill="#FFE9A8"><circle cx="92" cy="128" r="6"/><circle cx="140" cy="126" r="6"/><circle cx="190" cy="104" r="6"/><circle cx="240" cy="100" r="6"/><circle cx="290" cy="108" r="6"/><circle cx="340" cy="124" r="6"/><circle cx="392" cy="128" r="6"/></g>
