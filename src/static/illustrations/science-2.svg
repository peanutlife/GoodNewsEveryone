<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
<!-- Peanutlife section art, "Science & health" variant 2: a telescope out on a
     ridge, a comet going over. Night, looking up. Original flat drawing; figures
     are simple shapes with no facial features. Subject sits inside x 63-417,
     y 81-216, which is what the 32/9 band shows. -->
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15303E"/><stop offset=".6" stop-color="#1F5365"/><stop offset="1" stop-color="#2E7083"/></linearGradient>
<linearGradient id="tail" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#CDE9EE" stop-opacity=".85"/><stop offset="1" stop-color="#CDE9EE" stop-opacity="0"/></linearGradient>
</defs>
<rect width="480" height="270" fill="url(#g)"/>
<!-- the milky band -->
<g fill="#4E8A9C" opacity=".35">
<ellipse cx="300" cy="104" rx="210" ry="38" transform="rotate(-14 300 104)"/>
<ellipse cx="280" cy="112" rx="150" ry="20" transform="rotate(-14 280 112)"/>
</g>
<g fill="#FFFDF7">
<circle cx="56" cy="62" r="2.5"/><circle cx="118" cy="40" r="2"/><circle cx="170" cy="88" r="2.5"/><circle cx="214" cy="52" r="2"/>
<circle cx="268" cy="96" r="2.5"/><circle cx="318" cy="46" r="2"/><circle cx="368" cy="92" r="2.5"/><circle cx="430" cy="58" r="2"/>
<circle cx="90" cy="118" r="2"/><circle cx="146" cy="140" r="2.5"/><circle cx="406" cy="134" r="2"/><circle cx="454" cy="104" r="2.5"/>
<circle cx="238" cy="126" r="2"/><circle cx="62" cy="152" r="2"/>
</g>
<g fill="#CDE9EE" opacity=".9">
<path d="M126 70 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z"/>
<path d="M356 124 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5 z"/>
</g>
<!-- a crescent moon, top left -->
<path d="M68 90 a30 30 0 1 1 -22 -46 a24 24 0 0 0 22 46 z" fill="#E8EFD6"/>
<!-- the comet -->
<path d="M348 118 L212 44 L344 102 Z" fill="url(#tail)"/>
<circle cx="356" cy="122" r="13" fill="#DFF4F8"/>
<circle cx="356" cy="122" r="7" fill="#FFFDF7"/>
<!-- the ridge, painted before anything standing on it -->
<path d="M0 206 C 90 188 160 202 248 196 C 336 190 410 204 480 194 V270 H0 Z" fill="#123642"/>
<path d="M0 236 C 120 224 300 240 480 228 V270 H0 Z" fill="#0D2831"/>
<g fill="#1B4651"><circle cx="54" cy="196" r="10"/><circle cx="72" cy="200" r="7"/><circle cx="438" cy="192" r="9"/><circle cx="420" cy="196" r="7"/></g>
<!-- the telescope -->
<g stroke="#7FB7C8" stroke-width="6" stroke-linecap="round" fill="none">
<path d="M256 216 L236 164"/><path d="M216 216 L236 164"/><path d="M236 216 V168"/>
</g>
<g transform="rotate(-36 236 152)">
<rect x="174" y="136" width="124" height="34" rx="10" fill="#CDE9EE"/>
<rect x="174" y="136" width="124" height="13" rx="6" fill="#E8F4F7"/>
<rect x="286" y="130" width="20" height="46" rx="6" fill="#1F6B78"/>
<rect x="206" y="130" width="12" height="46" rx="4" fill="#7FB7C8"/>
<rect x="160" y="142" width="18" height="22" rx="6" fill="#1F6B78"/>
</g>
<rect x="238" y="140" width="30" height="13" rx="6" fill="#F2A65A" transform="rotate(-36 253 146)"/>
<circle cx="236" cy="152" r="8" fill="#1F6B78"/>
<!-- someone looking up beside it -->
<path d="M134 214 V170 a16 16 0 0 1 32 0 v44 z" fill="#4FAFA8"/>
<circle cx="150" cy="154" r="13" fill="#8C5A3C"/><path d="M137 154 a13 13 0 0 1 26 0 z" fill="#2F2A26"/>
<path d="M165 176 l20 -16" stroke="#8C5A3C" stroke-width="7" stroke-linecap="round"/>
</svg>
