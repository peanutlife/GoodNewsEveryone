<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
<!-- Peanutlife section art, "For kids" variant 3: the good bit of a wet day -
     one puddle, one paper boat, boots. Overcast, one flat cloud bank, no sun.
     Original flat drawing; figures are simple shapes with no facial features.
     Subject sits inside x 63-417, y 81-216, which is the 32/9 band. -->
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6E3D6"/><stop offset="1" stop-color="#F7EFD4"/></linearGradient>
</defs>
<rect width="480" height="270" fill="url(#g)"/>
<!-- one long cloud bank instead of two puffs -->
<g fill="#D9D5C5">
<rect x="-10" y="52" width="500" height="44" rx="22"/>
<circle cx="86" cy="58" r="26"/><circle cx="170" cy="50" r="32"/><circle cx="268" cy="56" r="28"/><circle cx="372" cy="52" r="30"/>
</g>
<g fill="#E6E2D2"><circle cx="128" cy="62" r="22"/><circle cx="318" cy="60" r="24"/></g>
<!-- rain -->
<g stroke="#BFD6DC" stroke-width="3" stroke-linecap="round" opacity=".8">
<path d="M46 110 l-6 18"/><path d="M106 126 l-6 18"/><path d="M152 102 l-6 18"/><path d="M212 134 l-6 18"/>
<path d="M330 106 l-6 18"/><path d="M386 130 l-6 18"/><path d="M438 108 l-6 18"/><path d="M276 112 l-6 18"/>
<path d="M78 158 l-5 14"/><path d="M414 162 l-5 14"/><path d="M186 166 l-5 14"/>
</g>
<!-- wet pavement, painted before anything on it -->
<path d="M0 200 H480 V270 H0 Z" fill="#CFC8B4"/>
<path d="M0 200 H480 v5 H0 Z" fill="#B8B09A"/>
<!-- the puddle -->
<ellipse cx="300" cy="222" rx="116" ry="26" fill="#9EC3CC"/>
<ellipse cx="300" cy="218" rx="116" ry="24" fill="#BFDDE4"/>
<g stroke="#FFFDF7" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M226 212 h34"/><path d="M332 228 h44"/><path d="M268 230 h26"/></g>
<!-- the paper boat -->
<path d="M352 214 h44 l-10 14 h-24 z" fill="#FBF7F1"/>
<path d="M374 212 V182 l-20 30 z" fill="#FFFDF7"/>
<path d="M376 212 V184 l18 28 z" fill="#E8E2D4"/>
<!-- the one under the umbrella -->
<path d="M130 134 a52 36 0 0 1 104 0 z" fill="#E8718A"/>
<path d="M130 134 a52 36 0 0 1 34 -34 a20 36 0 0 0 0 34 z" fill="#F2869B"/>
<path d="M200 134 a20 36 0 0 0 0 -34 a52 36 0 0 1 34 34 z" fill="#F2869B"/>
<path d="M182 100 V96" stroke="#A3471A" stroke-width="4" stroke-linecap="round"/>
<path d="M182 134 V190 a10 10 0 0 1 -18 6" stroke="#A3471A" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M146 212 V172 a16 16 0 0 1 32 0 v40 z" fill="#4FAFA8"/>
<circle cx="162" cy="156" r="13" fill="#C98C5A"/><path d="M149 156 a13 13 0 0 1 26 0 z" fill="#2F2A26"/>
<path d="M178 178 l-8 14" stroke="#C98C5A" stroke-width="7" stroke-linecap="round"/>
<path d="M150 212 v8 M172 212 v8" stroke="#F2C14E" stroke-width="12" stroke-linecap="round"/>
<!-- the one jumping, mid air over the puddle -->
<path d="M262 160 l-20 -14 M300 158 l22 -16" stroke="#C98C5A" stroke-width="7" stroke-linecap="round"/>
<path d="M264 190 V156 a17 17 0 0 1 34 0 v34 z" fill="#F2C14E"/>
<path d="M264 176 h34" stroke="#DCA92F" stroke-width="4"/>
<circle cx="281" cy="138" r="14" fill="#8C5A3C"/>
<path d="M267 138 a14 14 0 0 1 28 0 z" fill="#E8718A"/>
<path d="M295 140 a16 16 0 0 1 -28 0 a16 10 0 0 1 28 0 z" fill="#F2869B" opacity=".85"/>
<path d="M270 190 v14 M292 190 v14" stroke="#C98C5A" stroke-width="9" stroke-linecap="round"/>
<path d="M266 206 h10 M288 206 h10" stroke="#F2785C" stroke-width="12" stroke-linecap="round"/>
<!-- splash -->
<g fill="#BFDDE4"><circle cx="246" cy="206" r="5"/><circle cx="234" cy="194" r="4"/><circle cx="318" cy="202" r="5"/><circle cx="330" cy="190" r="4"/><circle cx="222" cy="210" r="3"/></g>
</svg>
