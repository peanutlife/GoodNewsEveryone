<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... | Peanutlife</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4295146235414490"
            crossorigin="anonymous"></script>

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .redirect-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .redirect-header {
            margin-bottom: 30px;
        }

        .redirect-header h1 {
            color: #333;
            font-size: 24px;
            margin: 0 0 10px 0;
        }

        .redirect-header p {
            color: #666;
            margin: 0;
        }

        .article-title {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            border-left: 4px solid #FF6B35;
        }

        .article-title h2 {
            margin: 0;
            color: #333;
            font-size: 18px;
            line-height: 1.4;
        }

        .countdown {
            font-size: 48px;
            font-weight: bold;
            color: #FF6B35;
            margin: 30px 0;
            min-height: 60px;
        }

        .countdown-text {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }

        .ad-container {
            margin: 30px 0;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .skip-button {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s;
            margin-top: 20px;
        }

        .skip-button:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .skip-button.disabled {
            background: #ccc;
            cursor: not-allowed;
            pointer-events: none;
        }

        .back-link {
            margin-top: 20px;
        }

        .back-link a {
            color: #FF6B35;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #FF6B35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="redirect-header">
            <h1>🥜 Peanutlife</h1>
            <p>Taking you to the full story...</p>
        </div>

        <div class="article-title">
            <h2>{{ article_title }}</h2>
        </div>

        <!-- Ad Space -->
        <div class="ad-container">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-4295146235414490"
                 data-ad-slot="5585311271"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
        </div>

        <!-- Countdown -->
        <div class="countdown" id="countdown">3</div>
        <p class="countdown-text" id="countdown-text">Redirecting in <span id="seconds">3</span> seconds...</p>

        <!-- Skip Button (enabled after 1 second) -->
        <a href="{{ target_url }}" id="skip-btn" class="skip-button disabled">
            Continue to Article →
        </a>

        <div class="back-link">
            <a href="/">← Back to Peanutlife</a>
        </div>
    </div>

    <script>
        // Push ad
        (adsbygoogle = window.adsbygoogle || []).push({});

        // Countdown and redirect
        let timeLeft = 3;
        const countdownEl = document.getElementById('countdown');
        const secondsEl = document.getElementById('seconds');
        const skipBtn = document.getElementById('skip-btn');
        const countdownText = document.getElementById('countdown-text');
        const targetUrl = {{ target_url|tojson }};

        console.log('Redirect page loaded. Target URL:', targetUrl);

        // Update countdown every second
        const interval = setInterval(() => {
            timeLeft--;
            console.log('Countdown:', timeLeft);

            // Update both the big countdown and the text
            countdownEl.textContent = timeLeft;
            secondsEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(interval);
                console.log('Redirecting to:', targetUrl);
                countdownText.textContent = 'Redirecting now...';
                countdownEl.innerHTML = '<div class="spinner"></div>';

                // Redirect immediately
                window.location.href = targetUrl;
            }
        }, 1000);

        // Enable skip button after 1 second
        setTimeout(() => {
            skipBtn.classList.remove('disabled');
            console.log('Skip button enabled');
        }, 1000);

        // Track redirect in Google Analytics
        if (typeof gtag !== 'undefined') {
            gtag('event', 'outbound_click', {
                'event_category': 'engagement',
                'event_label': targetUrl
            });
        }
    </script>
</body>
</html>
